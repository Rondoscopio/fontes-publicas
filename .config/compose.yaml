name: osint-rondonia

services:
  catalog:
    build:
      context: ..
      dockerfile: .config/container/Dockerfile
      target: catalog
    image: osint-rondonia-catalog:local
    working_dir: /workspace
    user: "${CATALOG_UID:-65534}:${CATALOG_GID:-65534}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs: [/tmp]
    volumes:
      - ..:/workspace:ro
    environment:
      HOME: /tmp
      RUFF_CACHE_DIR: /tmp/ruff
      XDG_CONFIG_HOME: /workspace/.config
      XDG_CACHE_HOME: /workspace/.cache
      XDG_DATA_HOME: /workspace/.local/share

  sqlite:
    extends: catalog
    volumes:
      - ../data/exports:/workspace/data/exports

  import-ibge:
    extends: catalog
    network_mode: bridge
    volumes:
      - ../data:/workspace/data

  quality:
    extends: catalog
    image: osint-rondonia-quality:local
    build:
      target: quality

  audit:
    extends: catalog
    network_mode: bridge
    volumes:
      - ../.cache/trivy:/trivy-cache
    image: osint-rondonia-audit:local
    build:
      target: audit

  markdown:
    extends: catalog
    image: osint-rondonia-markdown:local
    build:
      target: markdown
    entrypoint: [markdownlint]

  sbom:
    image: cyclonedx/cyclonedx-cli@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7
    platform: linux/amd64
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${CATALOG_UID:-65534}:${CATALOG_GID:-65534}"
    tmpfs: [/tmp]
    volumes:
      - ../.local/audit:/reports:ro

  links:
    image: lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892
    working_dir: /workspace
    user: "${CATALOG_UID:-65534}:${CATALOG_GID:-65534}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ..:/workspace:ro

  links-offline:
    extends: links
    network_mode: none

  semgrep:
    image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    working_dir: /workspace
    user: "${CATALOG_UID:-65534}:${CATALOG_GID:-65534}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
    volumes:
      - ..:/workspace:ro
    entrypoint: [semgrep]

  web:
    image: osint-rondonia-web:local
    build:
      context: ..
      dockerfile: .config/container/Web.Dockerfile
      target: web
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_BASE_PATH: ${SITE_BASE_PATH:-}

  web-dev:
    extends: web
    user: "${CATALOG_UID:-1000}:${CATALOG_GID:-1000}"
    environment:
      SITE_BASE_PATH: ""
      HOME: /tmp
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../.local/web-dev-kit:/workspace/web/.svelte-kit
      - ../.local/web-vite-temp:/workspace/web/node_modules/.vite-temp
      - ../.local/web-vite-cache:/workspace/web/node_modules/.vite
      - ../web/src:/workspace/web/src:ro
      - ../data/exports:/workspace/data/exports:ro
    command: [pnpm, dev]

  web-check:
    extends: web
    image: osint-rondonia-web-check:local
    build:
      target: web-check
    environment:
      SITE_BASE_PATH: /osint-rondonia
      CATALOG_BUILD_COMMIT_SHA: 0123456789abcdef0123456789abcdef01234567
      CATALOG_BUILD_RUN_NUMBER: "42"
      CATALOG_BUILD_RUN_URL: https://github.com/Rondoscopio/osint-rondonia/actions/runs/4242
    network_mode: none
    shm_size: 256mb
    tmpfs:
      - /tmp:mode=1777,uid=1000,gid=1000
      - /workspace/web/.svelte-kit:uid=1000,gid=1000
      - /workspace/web/test-results:uid=1000,gid=1000
      - /workspace/web/playwright-report:uid=1000,gid=1000
      - /workspace/web/node_modules/.vite-temp:uid=1000,gid=1000
      - /workspace/web/node_modules/.vite:uid=1000,gid=1000

  web-deps:
    extends: web
    user: "${CATALOG_UID:-1000}:${CATALOG_GID:-1000}"
    network_mode: bridge
    environment:
      HOME: /tmp
    volumes:
      - ../web:/workspace/web
      - ../web/node_modules:/workspace/web/node_modules
      - ../.cache/pnpm:/pnpm/store

  web-map-import:
    extends: web
    user: "${CATALOG_UID:-1000}:${CATALOG_GID:-1000}"
    network_mode: bridge
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../.cache/geodata:/cache
      - ../web/static/maps:/output/maps
      - ../.config/geodata:/workspace/.config/geodata:ro
      - ../data/municipio.csv:/input/municipio.csv:ro
    command: [node, scripts/import-map.mjs]

  web-build:
    extends: web
    user: "${CATALOG_UID:-1000}:${CATALOG_GID:-1000}"
    environment:
      SITE_BASE_PATH: ${SITE_BASE_PATH:-}
      CATALOG_BUILD_COMMIT_SHA: ${CATALOG_BUILD_COMMIT_SHA:-}
      CATALOG_BUILD_RUN_NUMBER: ${CATALOG_BUILD_RUN_NUMBER:-}
      CATALOG_BUILD_RUN_URL: ${CATALOG_BUILD_RUN_URL:-}
      HOME: /tmp
    volumes:
      - ../.local:/output
      - ../.local/web-kit:/workspace/web/.svelte-kit
      - ../.local/web-vite-temp:/workspace/web/node_modules/.vite-temp
      - ../.local/web-vite-cache:/workspace/web/node_modules/.vite
    command: [pnpm, build]

  web-format:
    extends: web-check
    user: "${CATALOG_UID:-1000}:${CATALOG_GID:-1000}"
    environment:
      HOME: /tmp
    read_only: false
    volumes:
      - ../web:/workspace/web
      - /workspace/web/node_modules
    command: [pnpm, exec, prettier, --write, .]
